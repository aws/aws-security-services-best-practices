<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124 560" width="1124" height="560" font-family="'Amazon Ember', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Example: AWS WAF label-based exceptions with NSM</title>
  <desc id="desc">Three requests pass through three NSM policies in order. AMRs-in-Count labels requests that match an AMR rule group without blocking them. App1 exceptions adds an exception label to approved App1 requests. AMR block with exceptions has one WAF rule for each AMR label, which blocks requests that carry that label unless they also carry its matching exception label. An App1 request to its approved path that matches the Core Rule Set continues. The same request to App2 is blocked. An App1 request that matches no AMR continues.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#879196"/></marker></defs>
  <rect x="0" y="0" width="1124" height="560" rx="12" fill="#FFFFFF"/>
  <text x="24" y="38" font-size="22" font-weight="700" fill="#16191F">Example: AWS WAF label-based exceptions</text>
  <text x="24" y="60" font-size="13" fill="#545B64">Each request moves left to right through the NSM policies and collects labels. The last NSM policy decides based on those labels.</text>
  <rect x="24" y="78" width="200" height="92" rx="10" fill="#F4F4F4" stroke="#C6CBCE" stroke-width="1.5"/>
  <text x="124.0" y="130" font-size="15" font-weight="700" fill="#16191F" text-anchor="middle">Request</text>
  <rect x="244" y="78" width="230" height="92" rx="10" fill="#FFF8F4" stroke="#E5B9A3" stroke-width="1.5"/>
  <text x="258" y="104" font-size="15" font-weight="700" fill="#C4511F">AMRs-in-Count</text>
  <text x="258" y="124" font-size="12" fill="#545B64">Priority 100 · central team</text>
  <text x="258" y="144" font-size="12" fill="#16191F">Count only. Adds an AMR label to</text>
  <text x="258" y="160" font-size="12" fill="#16191F">each match.</text>
  <rect x="494" y="78" width="230" height="92" rx="10" fill="#F1F9F4" stroke="#9FD08F" stroke-width="1.5"/>
  <text x="508" y="104" font-size="15" font-weight="700" fill="#1D8102">App1 exceptions</text>
  <text x="508" y="124" font-size="12" fill="#545B64">Priority 200–9499 · App1 team</text>
  <text x="508" y="144" font-size="12" fill="#16191F">Adds an exception label to</text>
  <text x="508" y="160" font-size="12" fill="#16191F">approved App1 requests.</text>
  <rect x="744" y="78" width="230" height="92" rx="10" fill="#F6F1FB" stroke="#C9B3E3" stroke-width="1.5"/>
  <text x="758" y="104" font-size="15" font-weight="700" fill="#7B4FB0">AMR block with exceptions</text>
  <text x="758" y="124" font-size="12" fill="#545B64">Priority 9500 · central team</text>
  <text x="758" y="144" font-size="12" fill="#16191F">One WAF rule per AMR label. Blocks</text>
  <text x="758" y="160" font-size="12" fill="#16191F">it without its exception label.</text>
  <rect x="994" y="78" width="106" height="92" rx="10" fill="#F4F4F4" stroke="#C6CBCE" stroke-width="1.5"/>
  <text x="1047.0" y="130" font-size="15" font-weight="700" fill="#16191F" text-anchor="middle">Result</text>
  <rect x="16" y="180" width="1092" height="112" rx="10" fill="#FAFAFA" stroke="#E9EBED"/>
  <text x="38" y="206" font-size="15" font-weight="700" fill="#0972D3">App1</text>
  <text x="38" y="226" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#16191F">/custom-feature/</text>
  <text x="38" y="248" font-size="12.5" fill="#545B64">Matches the Core Rule Set</text>
  <text x="38" y="264" font-size="12.5" fill="#545B64">XSS body WAF rule</text>
  <rect x="258" y="192" width="202" height="61" rx="6" fill="#FBEDE6" stroke="#C4511F"/>
  <text x="268" y="211" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#C4511F">awswaf:managed:aws:</text>
  <text x="268" y="226" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#C4511F">core-rule-set:</text>
  <text x="268" y="241" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#C4511F">CrossSiteScripting_Body</text>
  <text x="258" y="270" font-size="12.5" fill="#545B64">Labeled, not blocked</text>
  <rect x="508" y="192" width="202" height="46" rx="6" fill="#E6F4EA" stroke="#1D8102"/>
  <text x="518" y="211" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#1D8102">exception:core-rule-set:</text>
  <text x="518" y="226" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#1D8102">CrossSiteScripting_Body</text>
  <text x="508" y="254" font-size="12.5" fill="#545B64">Approved exception for</text>
  <text x="508" y="270" font-size="12.5" fill="#545B64">this one AMR WAF rule</text>
  <text x="758" y="214" font-size="13" fill="#16191F">AMR label and its</text>
  <text x="758" y="232" font-size="13" fill="#16191F">matching exception label</text>
  <text x="758" y="250" font-size="13" fill="#16191F" font-weight="700">Not blocked</text>
  <rect x="998" y="218" width="98" height="34" rx="17" fill="#E6F4EA" stroke="#1D8102"/>
  <text x="1047.0" y="240" font-size="13" font-weight="700" fill="#1D8102" text-anchor="middle">Continues</text>
  <line x1="226" y1="235" x2="240" y2="235" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="476" y1="235" x2="490" y2="235" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="726" y1="235" x2="740" y2="235" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="976" y1="235" x2="990" y2="235" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="16" y="302" width="1092" height="112" rx="10" fill="#FFFFFF" stroke="#E9EBED"/>
  <text x="38" y="328" font-size="15" font-weight="700" fill="#0972D3">App2</text>
  <text x="38" y="348" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#16191F">/custom-feature/</text>
  <text x="38" y="370" font-size="12.5" fill="#545B64">Same request,</text>
  <text x="38" y="386" font-size="12.5" fill="#545B64">different application</text>
  <rect x="258" y="314" width="202" height="61" rx="6" fill="#FBEDE6" stroke="#C4511F"/>
  <text x="268" y="333" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#C4511F">awswaf:managed:aws:</text>
  <text x="268" y="348" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#C4511F">core-rule-set:</text>
  <text x="268" y="363" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#C4511F">CrossSiteScripting_Body</text>
  <text x="258" y="392" font-size="12.5" fill="#545B64">Labeled, not blocked</text>
  <text x="508" y="338" font-size="12.5" fill="#545B64">No exception label.</text>
  <text x="508" y="354" font-size="12.5" fill="#545B64">App1's exception</text>
  <text x="508" y="370" font-size="12.5" fill="#545B64">doesn't reach App2.</text>
  <text x="758" y="336" font-size="13" fill="#D13212">AMR label, no matching</text>
  <text x="758" y="354" font-size="13" fill="#D13212">exception label</text>
  <text x="758" y="372" font-size="13" fill="#D13212" font-weight="700">Blocked</text>
  <rect x="998" y="340" width="98" height="34" rx="17" fill="#FDECEA" stroke="#D13212"/>
  <text x="1047.0" y="362" font-size="13" font-weight="700" fill="#D13212" text-anchor="middle">Blocked</text>
  <line x1="226" y1="357" x2="240" y2="357" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="476" y1="357" x2="490" y2="357" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="726" y1="357" x2="740" y2="357" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="976" y1="357" x2="990" y2="357" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="16" y="424" width="1092" height="112" rx="10" fill="#FAFAFA" stroke="#E9EBED"/>
  <text x="38" y="450" font-size="15" font-weight="700" fill="#0972D3">App1</text>
  <text x="38" y="470" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#16191F">/home</text>
  <text x="38" y="492" font-size="12.5" fill="#545B64">Matches no AMR</text>
  <text x="38" y="508" font-size="12.5" fill="#545B64">WAF rule</text>
  <text x="258" y="460" font-size="12.5" fill="#545B64">No AMR label.</text>
  <text x="258" y="476" font-size="12.5" fill="#545B64">Nothing matched.</text>
  <text x="508" y="460" font-size="12.5" fill="#545B64">No exception label.</text>
  <text x="508" y="476" font-size="12.5" fill="#545B64">Path isn't approved.</text>
  <text x="758" y="458" font-size="13" fill="#16191F">No AMR label</text>
  <text x="758" y="476" font-size="13" fill="#16191F" font-weight="700">Not blocked</text>
  <rect x="998" y="462" width="98" height="34" rx="17" fill="#E6F4EA" stroke="#1D8102"/>
  <text x="1047.0" y="484" font-size="13" font-weight="700" fill="#1D8102" text-anchor="middle">Continues</text>
  <line x1="226" y1="479" x2="240" y2="479" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="476" y1="479" x2="490" y2="479" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="726" y1="479" x2="740" y2="479" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="976" y1="479" x2="990" y2="479" stroke="#879196" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
