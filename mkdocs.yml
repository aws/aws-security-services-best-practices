site_name: AWS Security Services Best Practices
repo_name: aws/aws-security-services-best-practices
repo_url: https://github.com/aws/aws-security-services-best-practices
docs_dir: 'docs/en'
copyright: 'Copyright &copy; Amazon 2023'
site_author: 'AWS'
site_url: 'https://aws.github.io/aws-security-services-best-practices'
theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - tabs
    - content.code.copy
    - announce.dismiss
    - header.autohide
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: switch to light mode

nav:
  - Home: index.md
  - Amazon Certificate Services Best Practices: guides/certificate-services/index.md
  - Amazon Detective Best Practices: guides/detective/index.md
  - Amazon GuardDuty Best Practices: guides/guardduty/index.md
  - Amazon Inspector Best Practices: guides/inspector/index.md
  - Amazon Macie Best Practices: guides/macie/index.md
  - AWS Security Agent Best Practices: guides/security-agent/index.md
  - AWS Security Hub Best Practices: guides/security-hub/index.md
  - AWS Security Hub CSPM Best Practices: guides/security-hub-cspm/index.md
  - Amazon Security Lake Best Practices: guides/security-lake/index.md
  - AWS Network Security Fundamentals:
      - Introduction: guides/firewall-overview/index.md
      - Core concepts: guides/firewall-overview/fundamentals/docs/index.md
      - Ingress Patterns: guides/firewall-overview/ingress-patterns/docs/index.md
      - Egress Patterns: guides/firewall-overview/egress-patterns/docs/index.md
      - East-West Traffic and Segmentation: guides/firewall-overview/segmentation/docs/index.md
      - Cost Considerations and Reference: guides/firewall-overview/cost-and-reference/docs/index.md
  - AWS WAF Best Practices:
      - Home: guides/waf/index.md
      - Prerequisites and Fundamentals: guides/waf/prerequisites/docs/index.md
      - Recommended HTTP Architecture on AWS: guides/waf/recommended-http-architecture/docs/index.md
      - Operationalizing: guides/waf/operationalizing/docs/index.md
      - AWS Managed Rules: guides/waf/aws-managed-rules/docs/index.md
      - Custom Rules: guides/waf/custom-rules/docs/index.md
      - Bot Management: guides/waf/bot-management/docs/index.md
      - Fraud Prevention: guides/waf/fraud-prevention/docs/index.md
      - Recommended WAF Rule Order: guides/waf/recommended-waf-rule-order/docs/index.md
      - CAPTCHA and Challenge: guides/waf/captcha-and-challenge/docs/index.md
      - WAF Costs: guides/waf/waf-cost/docs/index.md
      - Logging Approaches: guides/waf/waf-logging/docs/index.md
      - Querying and Visualizing WAF Logs: guides/waf/monitoring-waf-rules/docs/index.md
      - Using WAF with Other AWS Services: guides/waf/using-waf-with-other-services/docs/index.md
      - Additional References: guides/waf/additional-references/docs/index.md
  - AWS Network Firewall Best Practices:
      - Introduction: guides/network-firewall/index.md
      - Prerequisites and fundamentals: guides/network-firewall/prerequisites/docs/index.md
      - Deployment architecture: guides/network-firewall/deployment-architecture/docs/index.md
      - Firewall policy configuration: guides/network-firewall/firewall-policy-configuration/docs/index.md
      - Customer managed rules: guides/network-firewall/customer-managed-rules/docs/index.md
      - Sample Suricata rules: guides/network-firewall/sample-suricata-rules/docs/index.md
      - AWS Managed Rules: guides/network-firewall/aws-managed-rules/docs/index.md
      - TLS inspection: guides/network-firewall/tls-inspection/docs/index.md
      - Logging and monitoring: guides/network-firewall/logging-and-monitoring/docs/index.md
      - Getting started policy: guides/network-firewall/getting-started-policy/docs/index.md
      - Cost considerations: guides/network-firewall/cost-considerations/docs/index.md
      - Additional references: guides/network-firewall/additional-references/docs/index.md
      - Quick reference: guides/network-firewall/quick-reference/docs/index.md
  - Amazon Route 53 Resolver DNS Firewall Best Practices: guides/dns-firewall/index.md
  - Contributors: contributors.md
markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight:
        anchor_linenums: true
    - mdx_truly_sane_lists:
        truly_sane: true
        nested_indent: 2
    - toc:
        slugify: !!python/object/apply:pymdownx.slugs.slugify
          kwds:
            case: lower

plugins:
    - i18n:
        docs_structure: suffix
        fallback_to_default: true
        reconfigure_material: true
        reconfigure_search: true
        languages:
          - locale: en
            default: true
            name: English
            build: true
          - locale: ko
            name: 한국어
            build: true
            nav:
              - 홈: index.md
              - AWS WAF 모범 사례:
                - 홈: guides/waf/index.md
                - 사전 요구 사항 및 기본 사항: guides/waf/prerequisites/docs/index.md
                - 권장 HTTP 아키텍처: guides/waf/recommended-http-architecture/docs/index.md
                - 운영화: guides/waf/operationalizing/docs/index.md
                - AWS 관리형 규칙: guides/waf/aws-managed-rules/docs/index.md
                - 사용자 정의 규칙: guides/waf/custom-rules/docs/index.md
                - 봇 관리: guides/waf/bot-management/docs/index.md
                - 사기 방지: guides/waf/fraud-prevention/docs/index.md
                - 권장 WAF 규칙 순서: guides/waf/recommended-waf-rule-order/docs/index.md
                - CAPTCHA 및 Challenge: guides/waf/captcha-and-challenge/docs/index.md
                - WAF 비용: guides/waf/waf-cost/docs/index.md
                - 로깅 접근 방식: guides/waf/waf-logging/docs/index.md
                - WAF 로그 쿼리 및 시각화: guides/waf/monitoring-waf-rules/docs/index.md
                - 다른 AWS 서비스와 함께 WAF 사용: guides/waf/using-waf-with-other-services/docs/index.md
                - 추가 참고 자료: guides/waf/additional-references/docs/index.md
              - AWS Network Firewall 모범 사례:
                - 소개: guides/network-firewall/index.md
                - 사전 요구 사항 및 기본 사항: guides/network-firewall/prerequisites/docs/index.md
                - 배포 아키텍처: guides/network-firewall/deployment-architecture/docs/index.md
                - 방화벽 정책 구성: guides/network-firewall/firewall-policy-configuration/docs/index.md
                - 고객 관리 규칙: guides/network-firewall/customer-managed-rules/docs/index.md
                - 샘플 Suricata 규칙: guides/network-firewall/sample-suricata-rules/docs/index.md
                - AWS 관리형 규칙: guides/network-firewall/aws-managed-rules/docs/index.md
                - TLS 검사: guides/network-firewall/tls-inspection/docs/index.md
                - 로깅 및 모니터링: guides/network-firewall/logging-and-monitoring/docs/index.md
                - 시작 정책: guides/network-firewall/getting-started-policy/docs/index.md
                - 비용 고려 사항: guides/network-firewall/cost-considerations/docs/index.md
                - 추가 참고 자료: guides/network-firewall/additional-references/docs/index.md
                - 모범 사례 빠른 참조: guides/network-firewall/quick-reference/docs/index.md
          - locale: ja
            name: 日本語
            build: true
            nav:
              - ホーム: index.md
              - AWS Network Firewall ベストプラクティス: guides/network-firewall/index.md
              - Amazon Route 53 Resolver DNS Firewall ベストプラクティス: guides/dns-firewall/index.md
    - search
